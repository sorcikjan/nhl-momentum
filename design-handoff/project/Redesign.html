<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NHL Momentum — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1c1c1c; color: #e2e8f0; font-family: 'Geist', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  /* Design tokens used across frames */
  :root {
    --nm-bg:          #0a0b0f;
    --nm-bg-card:     #13151c;
    --nm-bg-raised:   #1a1d26;
    --nm-bg-hover:    #1f2330;
    --nm-border:      #252a38;
    --nm-border-soft: #1c2030;
    --nm-text:        #8a94a6;
    --nm-text-muted:  #5a6378;
    --nm-text-bright: #f4f5f8;
    --nm-blue:        #4d7cff;
    --nm-blue-dim:    rgba(77,124,255,0.12);
    --nm-heat:        #ff5a24;
    --nm-heat-dim:    rgba(255,90,36,0.14);
    --nm-cold:        #3a88ff;
    --nm-rise:        #00e5a0;
    --nm-rise-dim:    rgba(0,229,160,0.12);
    --nm-story:       #e5508b;
    --nm-story-dim:   rgba(229,80,139,0.14);
    --nm-gold:        #ffb547;
  }
</style>
</head>

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
