[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Player photos from the NHL, resized by the image CDN (lib/img.ts).
[images]
  remote_images = ["https://assets\\.nhle\\.com/.*"]

[functions]
  directory = "netlify/functions"

# The old domain moves permanently to the new one, path for path. The
# netlify.app address keeps serving: the scheduled functions call it.
[[redirects]]
  from = "https://nhl-momentum.com/*"
  to = "https://hockeymomentum.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.nhl-momentum.com/*"
  to = "https://hockeymomentum.com/:splat"
  status = 301
  force = true
